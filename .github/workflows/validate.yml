name: Validate PowerShell

on:
  push:
  pull_request:

jobs:
  validate:
    name: Windows PowerShell 5.1 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2022
          - windows-2025
    steps:
      - uses: actions/checkout@v5

      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem -Path . -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Test cleanup behavior and path safety
        shell: powershell
        run: .\work\Test-Cleanup.ps1

      - name: Test installer safety guards
        shell: powershell
        run: .\work\Test-InstallGuards.ps1

      - name: Test full install and uninstall lifecycle
        shell: powershell
        run: .\work\Test-InstallLifecycle.ps1
